<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <style>
        body {
            width: 300px;
            padding: 20px;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        
        .header {
            text-align: center;
            margin-bottom: 20px;
        }
        
        .header h1 {
            margin: 0;
            font-size: 18px;
            font-weight: 600;
        }
        
        .status {
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 15px;
            padding: 8px;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.1);
        }
        
        .status-icon {
            width: 16px;
            height: 16px;
            margin-right: 8px;
        }
        
        .preferences {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 15px;
        }
        
        .preference-group {
            margin-bottom: 12px;
        }
        
        .preference-group:last-child {
            margin-bottom: 0;
        }
        
        label {
            display: flex;
            align-items: center;
            cursor: pointer;
            font-size: 14px;
            margin-bottom: 5px;
        }
        
        input[type="checkbox"] {
            margin-right: 8px;
            transform: scale(1.2);
        }
        
        .button-group {
            display: flex;
            gap: 10px;
        }
        
        button {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
        }
        
        .save-btn {
            background: #4CAF50;
            color: white;
        }
        
        .save-btn:hover {
            background: #45a049;
            transform: translateY(-1px);
        }
        
        .reset-btn {
            background: rgba(255, 255, 255, 0.2);
            color: white;
        }
        
        .reset-btn:hover {
            background: rgba(255, 255, 255, 0.3);
        }
        
        .footer {
            text-align: center;
            margin-top: 15px;
            font-size: 11px;
            opacity: 0.8;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>🍪 Smart Cookie Manager</h1>
    </div>
    
    <div class="status" id="status">
        <span class="status-icon" id="statusIcon">⚪</span>
        <span id="statusText">Ready</span>
    </div>
    
    <div class="preferences">
        <div class="preference-group">
            <label>
                <input type="checkbox" id="necessary" checked disabled>
                <span>✅ Necessary Cookies (Required)</span>
            </label>
        </div>
        
        <div class="preference-group">
            <label>
                <input type="checkbox" id="functional">
                <span>⚙️ Functional Cookies</span>
            </label>
        </div>
        
        <div class="preference-group">
            <label>
                <input type="checkbox" id="analytics">
                <span>📊 Analytics Cookies</span>
            </label>
        </div>
        
        <div class="preference-group">
            <label>
                <input type="checkbox" id="marketing">
                <span>📢 Marketing Cookies</span>
            </label>
        </div>
        
        <div class="preference-group">
            <label>
                <input type="checkbox" id="social">
                <span>👥 Social Media Cookies</span>
            </label>
        </div>
    </div>
    
    <div class="button-group">
        <button class="save-btn" id="saveBtn">Save Preferences</button>
        <button class="reset-btn" id="resetBtn">Reset</button>
    </div>
    
    <!-- <div class="button-group" style="margin-top: 10px;">
        <button class="save-btn" id="scanBtn" style="background: #2196F3;">Scan Page Now</button>
    </div> -->
    
    <div class="footer">
        <p>Auto-applies your preferences on all sites</p>
    </div>
    
    <script src="popup.js"></script>
</body>
</html>
